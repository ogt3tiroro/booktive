<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24406e">
  <meta name="description" content="本活 Booktive（ブックティブ）— 本の検索・読書記録・好きな作家・図書館予約・SNSの話題をひとつに。">
  <title>本活 Booktive</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#shelf">
      <span class="brand-ja">本活</span>
      <span class="brand-en">Booktive</span>
    </a>
    <button class="icon-btn" id="scanTopBtn" type="button" aria-label="バーコードで検索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v14M6 5v14M9 5v14M12 5v14M16 5v14M18 5v14M21 5v14" /></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#shelf" data-tab="shelf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z" /></svg><span>本棚</span></a>
    <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg><span>検索</span></a>
    <a href="#authors" data-tab="authors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.7c0 5.4-7.5 10-7.5 10z" /></svg><span>作家</span></a>
    <a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg><span>記録</span></a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5.5-5.5 4 4L21 7M15 7h6v6" /></svg><span>話題</span></a>
    <a href="#more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6" /></svg><span>図書館・賞</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-bar">
        <span class="brand"><span class="brand-ja">本活</span><span class="brand-en">Booktive</span></span>
        <button class="sheet-close" type="button" data-close aria-label="閉じる">×</button>
      </div>
      <div class="sheet-inner" id="sheetBody"></div>
    </section>
  </div>

  <div class="scanner" id="scanner" hidden>
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame" aria-hidden="true"></div>
    <p class="scan-hint" id="scanHint">本の裏表紙にある「978」または「979」で始まるバーコードを枠に合わせてください</p>
    <button class="btn btn-light scan-cancel" type="button" id="scanCancel">閉じる</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="data/awards.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
