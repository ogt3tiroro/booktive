<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8452f">
  <meta name="description" content="お弁当ツクール — 1週間のお弁当献立をおまかせで。材料から探す、弁当箱の詰め方、スープジャーの汁物、ヘビロテレシピも。">
  <title>お弁当ツクール</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#week">
      <span class="brand-ja">お弁当ツクール</span>
    </a>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#week" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>献立</span></a>
    <a href="#pack" data-tab="pack"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M11 5v14M11 12h10M16 12v7"/></svg><span>詰め方</span></a>
    <a href="#pantry" data-tab="pantry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18H7zM7 10h10M10 6v2M10 13v3"/></svg><span>材料から</span></a>
    <a href="#recipes" data-tab="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>レシピ</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-bar">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <button class="sheet-close" type="button" data-close aria-label="閉じる">×</button>
      </div>
      <div class="sheet-inner" id="sheetBody"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
